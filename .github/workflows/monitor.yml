name: Verificare surse oficiale

on:
  schedule:
    - cron: "23 5 * * *"   # zilnic, ~07:23 ora României
  workflow_dispatch:        # buton manual „Run workflow”

permissions:
  contents: write
  issues: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalează bibliotecile
        run: pip install requests pypdf

      - name: Verifică sursele
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python monitor.py

      - name: Salvează rezultatul
        run: |
          git config user.name "psistart-bot"
          git config user.email "psistart-bot@users.noreply.github.com"
          git add data/status.json data/noutati.json data/registre.json state/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Verificare surse $(date -u +'%Y-%m-%d %H:%M')"
          git push
